preprocess:

  # 1 = Livox
  # 2 = velodyne
  # 3 = Ouster64
  # 4 = HESAIxt32
  # 5 = plain simulation (FlightForge) without additional PCL data
  # 6 = gazebo simulation (x, y, z, intenzity, ring)
  lidar_type: 1

  # this should only be used when the PointCloud has no timestamps for the points, which
  # should be ok with Mid360
  scan_rate: 100 # [Hz]

mapping:

  # Livox MID360 Lidar->IMU
  extrinsic_T: [ 0.011, 0.02329, -0.04412 ]

  extrinsic_R: [ 1, 0, 0,
                 0, 1, 0,
                 0, 0, 1 ]
